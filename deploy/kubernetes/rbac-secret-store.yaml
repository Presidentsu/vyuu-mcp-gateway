# RBAC for VYUU_SECRET_STORE_BACKEND=kubernetes. The gateway reads one Secret
# per tenant, named `vyuu-<tenant_id>`, through the API server with its own
# service-account token — so the Role is scoped to exactly that object with
# `resourceNames`, and the only verb is `get` (the store never writes).
# The pod spec must mount the service-account token for this backend
# (deploy/setup flips `automountServiceAccountToken` for you).
#
# Operators put upstream credentials into that Secret out of band, e.g.
#   kubectl -n __NAMESPACE__ create secret generic vyuu-__TENANT_ID__ \
#     --from-literal=<ref>=<value>
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vyuu-gateway-secret-store
  namespace: __NAMESPACE__
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vyuu-__TENANT_ID__"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vyuu-gateway-secret-store
  namespace: __NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: vyuu-gateway
    namespace: __NAMESPACE__
roleRef:
  kind: Role
  name: vyuu-gateway-secret-store
  apiGroup: rbac.authorization.k8s.io
