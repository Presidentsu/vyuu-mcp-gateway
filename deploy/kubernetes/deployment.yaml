################################################################################
# Vyuu MCP Gateway — Kubernetes Deployment manifest.
#
# Tier-1 stress-test fixes wired here:
#
# - `livenessProbe` + `readinessProbe` target `/healthz` (the route
#   bypassed by the per-tenant inflight gate). Without this, a brief
#   load burst would make `/api/v1/health` time out, K8s would
#   restart the pod, traffic would redistribute, and the cascade
#   would amplify the original problem.
#
# - `resources.limits.memory` + `requests.memory` pinned. K8s OOM-kills
#   cleanly on overrun, supervisor restarts via `restartPolicy: Always`.
#
# - PodDisruptionBudget guarantees minimum available pods during
#   voluntary disruptions (rolling updates, node drains).
#
# - HorizontalPodAutoscaler scales on RPS (via custom metric from
#   the Prometheus exporter) — falls back to CPU when custom
#   metrics aren't yet wired.
#
# - Network policies limit egress to the explicit upstream allow-list
#   (Postgres, Redis, NATS, configured outbound MCP hosts).
################################################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyuu-gateway
  namespace: vyuu
  labels:
    app.kubernetes.io/name: vyuu-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vyuu-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vyuu-gateway
        app.kubernetes.io/component: gateway
      annotations:
        # Force a rolling restart when ConfigMap or Secret change
        # without changing the manifest hash. Helm / kustomize
        # plug-ins fill these in at apply time.
        checksum/config: "${CHECKSUM_CONFIG}"
        checksum/secret: "${CHECKSUM_SECRET}"
    spec:
      serviceAccountName: vyuu-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread pods across nodes so a single node failure doesn't
      # take the whole gateway tier down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vyuu-gateway
      containers:
        - name: gateway
          image: ghcr.io/your-org/vyuu-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Liveness probe MUST target /healthz, NOT /api/v1/health.
          # /healthz is mounted at app root and explicitly bypassed
          # by the per-tenant inflight gate; it stays green even when
          # tool-call traffic is queued at the back-pressure cap.
          # Targeting /api/v1/health would cause false-positive
          # restarts during normal load bursts.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          # Startup probe gives the bootstrap path (DB migration
          # check, config seed) up to 60s before liveness kicks in.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12  # 12 × 5s = 60s
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          envFrom:
            - configMapRef:
                name: vyuu-gateway-config
            - secretRef:
                name: vyuu-gateway-secrets
          # Most env vars come from ConfigMap / Secret. The few here
          # are the ones we want pinned at the manifest level.
          env:
            - name: VYUU_ENVIRONMENT
              value: production
            - name: VYUU_LOG_LEVEL
              value: INFO
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable tmpfs for stdio-MCP working dirs (uvx / npx
            # spawn temp files during tool execution).
            - name: tmp
              mountPath: /tmp
          # Graceful drain on pod termination — give in-flight
          # requests time to complete before SIGKILL.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      terminationGracePeriodSeconds: 30
      # If a pod gets evicted (node pressure, disruption), allow
      # immediate reschedule rather than the default 30s backoff.
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: vyuu-gateway
  namespace: vyuu
  labels:
    app.kubernetes.io/name: vyuu-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vyuu-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vyuu-gateway
  namespace: vyuu
spec:
  minAvailable: 2  # Of 3 replicas, at least 2 must stay up during
                   # voluntary disruptions (node drain, rolling update).
  selector:
    matchLabels:
      app.kubernetes.io/name: vyuu-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vyuu-gateway
  namespace: vyuu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vyuu-gateway
  minReplicas: 3
  maxReplicas: 12
  # CPU-based scaling is the v1 fallback. Once the Prometheus
  # adapter is wired (Tier-2 work), switch to a custom metric on
  # `vyuu_inflight_requests` averaged across pods — that scales
  # more predictably for async workloads where CPU doesn't track
  # load linearly.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5min — don't oscillate
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100  # Double the pod count if needed
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyuu-gateway
  namespace: vyuu
automountServiceAccountToken: false
