# In-cluster PostgreSQL 16 for evaluation and small single-cluster installs.
# One replica, one PersistentVolumeClaim, no HA, no backups — production
# deployments should point VYUU_DATABASE_URL at a managed / HA Postgres
# instead (docs/DEPLOYMENT.md, "Shape 2"). Rendered by deploy/setup.
apiVersion: v1
kind: Secret
metadata:
  name: vyuu-postgres
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: vyuu-postgres
    app.kubernetes.io/part-of: vyuu-gateway
type: Opaque
stringData:
  POSTGRES_USER: vyuu
  POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
  POSTGRES_DB: vyuu_gateway
---
apiVersion: v1
kind: Service
metadata:
  name: vyuu-postgres
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: vyuu-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vyuu-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vyuu-postgres
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: vyuu-postgres
    app.kubernetes.io/part-of: vyuu-gateway
spec:
  serviceName: vyuu-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vyuu-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vyuu-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: vyuu-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vyuu", "-d", "vyuu_gateway"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vyuu", "-d", "vyuu_gateway"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
