# Prometheus scrape config for the Vyuu perf observability stack.
#
# Both the in-process middleware and the exporter run on the host.
# `host.docker.internal` resolves to the host from inside the
# Prometheus container on Docker Desktop (macOS + Windows). On Linux,
# add `extra_hosts: ["host.docker.internal:host-gateway"]` to the
# prometheus service in docker-compose.yml.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: vyuu-gateway-middleware
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          source: middleware
    metrics_path: /metrics

  - job_name: vyuu-gateway-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          source: exporter
    metrics_path: /metrics

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
